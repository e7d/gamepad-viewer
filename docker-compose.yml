services:
    web:
        image: nginx
        ports:
            - 8081:80
        volumes:
            - .:/usr/share/nginx/html:ro
            - ./docker/default.conf:/etc/nginx/conf.d/default.conf:ro

    dist:
        profiles:
            - dist
        build: .
        ports:
            - 8082:8080
        read_only: true
        tmpfs:
            - /tmp
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
